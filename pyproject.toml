[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perplexity-search-mcp"
version = "1.0.0"
description = "Model Context Protocol server for Perplexity's web search"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "mcp>=0.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
perplexity-search-mcp = "server:main"

[project.urls]
Homepage = "https://github.com/yourusername/perplexity-search-mcp"
Repository = "https://github.com/yourusername/perplexity-search-mcp"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
